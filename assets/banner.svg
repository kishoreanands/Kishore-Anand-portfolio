<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080e21" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#9d4edd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070d1d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .mono-text { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 13px; fill: #64748b; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #00f2fe; letter-spacing: 1.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; letter-spacing: 2px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #f8fafc; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1200" height="340" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="120" fill="#00f2fe" opacity="0.07" filter="url(#glow)" />
  <circle cx="1020" cy="240" r="140" fill="#9d4edd" opacity="0.09" filter="url(#glow)" />

  <!-- Outer Neon Trim -->
  <path d="M 20 0 L 1180 0" stroke="url(#glowLine)" stroke-width="3" />
  <path d="M 20 340 L 1180 340" stroke="url(#glowLine)" stroke-width="2" />

  <!-- Status Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="255" height="30" rx="15" fill="#0c172e" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="18" cy="15" r="4.5" fill="#10b981" filter="url(#softGlow)" />
    <text x="32" y="19" class="badge-text">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Title / Identity -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="44" fill="url(#accentGrad)" class="title-text" filter="url(#softGlow)">KISHORE ANAND S</text>
    <text x="0" y="32" class="subtitle-text">ELECTRONICS &amp; COMMUNICATION ENGINEER &bull; ASPIRING JAVA DEVELOPER</text>
  </g>

  <!-- Interactive Pillars / Feature Pills -->
  <g transform="translate(60, 205)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="38" rx="8" fill="#0d182e" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="tag-text">☕ Core Java &amp; DSA</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(215, 0)">
      <rect width="225" height="38" rx="8" fill="#131433" stroke="#9d4edd" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="tag-text">🔬 VLSI &amp; Chip Design</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(455, 0)">
      <rect width="220" height="38" rx="8" fill="#0d182e" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="tag-text">⚡ EV BMS &amp; IoT Systems</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(690, 0)">
      <rect width="200" height="38" rx="8" fill="#131433" stroke="#f72585" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="tag-text">🤖 AI &amp; Smart Apps</text>
    </g>
  </g>

  <!-- Terminal Style Right-Side Interactive Card -->
  <g transform="translate(930, 48)">
    <rect width="210" height="195" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <!-- Terminal dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="18" r="4.5" fill="#eab308" />
    <circle cx="48" cy="18" r="4.5" fill="#22c55e" />
    <line x1="0" y1="32" x2="210" y2="32" stroke="#1e293b" stroke-width="1" />

    <text x="18" y="58" class="mono-text" fill="#94a3b8">&gt; status: <tspan fill="#10b981">online</tspan></text>
    <text x="18" y="82" class="mono-text" fill="#94a3b8">&gt; cgpa: <tspan fill="#00f2fe">7.6 / 10</tspan></text>
    <text x="18" y="106" class="mono-text" fill="#94a3b8">&gt; certs: <tspan fill="#9d4edd">3 industry</tspan></text>
    <text x="18" y="130" class="mono-text" fill="#94a3b8">&gt; code: <tspan fill="#f72585">Java &bull; C &bull; Web</tspan></text>
    <text x="18" y="154" class="mono-text" fill="#94a3b8">&gt; build: <tspan fill="#00f2fe">Vercel Live</tspan></text>
    <text x="18" y="178" class="mono-text" fill="#475569">// verified</text>
  </g>

  <!-- Bottom Accent Ribbon -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" class="mono-text">VSB Engineering College &bull; Karur, Tamil Nadu &bull; kishoreanand876@gmail.com</text>
  </g>
</svg>
